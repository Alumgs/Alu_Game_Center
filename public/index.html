<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALU PLAY</title>
<style>
:root{color-scheme:dark;--bg:#07111b;--panel:#0d1b2a;--line:#21364b;--text:#eef6fb;--muted:#8ea6b8;--accent:#72e0cd;--danger:#ff776d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16344b 0,transparent 35%),var(--bg);font:15px/1.5 system-ui,-apple-system,"Microsoft Yahei",sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:28px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand h1{margin:0;font-size:24px;letter-spacing:.14em}.brand small{color:var(--muted)}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;min-height:72vh;align-items:center}.copy h2{font-size:clamp(42px,7vw,84px);line-height:.92;margin:12px 0;letter-spacing:-.055em}.copy p{max-width:610px;color:var(--muted);font-size:18px}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chip{border:1px solid var(--line);padding:7px 11px;border-radius:999px;color:#cce5ee}.card,.game{border:1px solid var(--line);background:#0b1825d9;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0006}.card h3{margin-top:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#08131e;color:var(--text);border-radius:10px;padding:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);background:#102337;color:var(--text);border-radius:10px;padding:10px 14px}.btn.primary{background:var(--accent);color:#062522;border-color:var(--accent);font-weight:750}.btn.danger{color:#ffd8d4;border-color:#7f403b}.muted{color:var(--muted)}#app{display:none}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.game h3{margin:0 0 8px}.game p{color:var(--muted);min-height:44px}.meta{font-size:12px;color:var(--muted);margin:10px 0 16px}.admin{margin-top:28px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:10px}.tabs{display:flex;gap:8px;margin-bottom:16px}.hidden{display:none!important}.status{min-height:22px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px}.ok{color:#83efbc}.off{color:#a7b5c1}@media(max-width:760px){.hero,.admin-grid{grid-template-columns:1fr}.copy h2{font-size:50px}.shell{padding:18px}.hero{align-items:start}.topbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><h1>ALU PLAY</h1><small>SMALL GAMES. BIG WORLDS.</small></div>
  <section id="auth" class="hero">
    <div class="copy"><div class="muted">独立游戏空间</div><h2>好玩的世界，<br>一起进入。</h2><p>你的私人游戏库，也是与朋友相遇的地方。从一场机房大战，开始今天的冒险。</p><div class="chips"><span class="chip">01 / 多人在线</span><span class="chip">02 / 沉浸探索</span><span class="chip">03 / 自由实验</span></div></div>
    <div class="card"><h3 id="authTitle">欢迎回来</h3><div class="tabs"><button class="btn primary" id="loginTab">登录</button><button class="btn" id="registerTab">注册</button></div><div class="field"><label>用户名</label><input id="username" autocomplete="username"></div><div class="field"><label>密码</label><div class="row"><input id="password" type="password" autocomplete="current-password"><button class="btn" id="showPwd">显示</button></div></div><button class="btn primary" id="submitAuth">登录游戏库</button><p id="authMsg" class="muted status"></p><small class="muted">在线时长仅统计页面处于前台时的连接时长。</small></div>
  </section>
  <section id="app">
    <div class="topbar"><div><h2 style="margin:0">欢迎，<span id="meName"></span></h2><div class="muted">今天想玩什么？</div></div><div class="row"><span id="myTime" class="muted"></span><button class="btn" id="changePwd">修改密码</button><button class="btn" id="logout">退出</button></div></div>
    <div id="games" class="games"></div>
    <section id="admin" class="admin hidden"><h2>管理员后台</h2><div class="admin-grid">
      <div class="card"><h3>游戏库管理</h3><div class="field"><label>游戏名称</label><input id="gTitle"></div><div class="field"><label>Slug</label><input id="gSlug" placeholder="例如 my-game"></div><div class="field"><label>描述</label><textarea id="gDesc" rows="3"></textarea></div><div class="row"><label><input id="gVisible" type="checkbox" checked> 用户可见</label><button class="btn primary" id="createGame">新增游戏</button></div><div class="muted" style="margin-top:10px">新增后可直接上传单文件 HTML；再次上传会覆盖为新版本。</div><div id="adminGames" class="list" style="margin-top:16px"></div></div>
      <div class="card"><h3>运营概览</h3><div id="online" style="font-size:42px;font-weight:800">0</div><div class="muted">当前在线用户</div><div id="users" class="list" style="margin-top:16px"></div></div>
    </div></section>
  </section>
</div>
<script>
let mode='login',me=null,games=[],hb=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Number(s||0);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}小时${m}分`:`${m}分钟`};
async function api(path,opt={}){const headers={...(opt.headers||{})};if(!(opt.body instanceof FormData)&&opt.body!==undefined)headers['content-type']='application/json';const r=await fetch(path,{...opt,headers});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'请求失败');return j}
function setMode(m){mode=m;$('authTitle').textContent=m==='login'?'欢迎回来':'创建账号';$('submitAuth').textContent=m==='login'?'登录游戏库':'注册并进入';$('loginTab').className='btn'+(m==='login'?' primary':'');$('registerTab').className='btn'+(m==='register'?' primary':'')}
$('showPwd').onclick=()=>{const i=$('password');i.type=i.type==='password'?'text':'password';$('showPwd').textContent=i.type==='password'?'显示':'隐藏'};
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');
$('submitAuth').onclick=async()=>{try{$('authMsg').textContent='处理中…';await api('/api/'+mode,{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('authMsg').textContent='';await boot()}catch(e){$('authMsg').textContent=e.message}};
$('logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});location.href='/'};
$('changePwd').onclick=async()=>{const oldPassword=prompt('请输入当前密码');if(oldPassword===null)return;const newPassword=prompt('请输入新密码（至少8位）');if(newPassword===null)return;try{await api('/api/change-password',{method:'POST',body:JSON.stringify({old_password:oldPassword,new_password:newPassword})});alert('密码已修改，请妥善保存')}catch(e){alert(e.message)}};
async function boot(){try{const m=await api('/api/me');me=m.user;$('auth').style.display='none';$('app').style.display='block';$('meName').textContent=me.username;$('myTime').textContent='累计 '+fmt(me.total_seconds);$('admin').classList.toggle('hidden',me.role!=='admin');await loadGames();if(me.role==='admin')await loadAdmin();startHeartbeat()}catch{$('auth').style.display='grid';$('app').style.display='none'}}
async function loadGames(){games=(await api('/api/games')).games;$('games').innerHTML=games.filter(g=>g.visible||me.role==='admin').map(g=>`<article class="game"><div class="muted">${g.kind==='proxy'?'MULTIPLAYER':'HTML GAME'}</div><h3>${esc(g.title)}</h3><p>${esc(g.description||'')}</p><div class="meta">累计游玩 ${fmt(g.play_seconds)} ${g.visible?'· 已上架':'· 已隐藏'}</div><button class="btn primary" onclick="play(${g.id},'${g.launch_path||('/games/'+g.id+'/')}')">开始游戏</button></article>`).join('')}
function play(id,path){sessionStorage.setItem('alu_game',String(id));location.href=path}
async function loadAdmin(){const s=await api('/api/admin/stats');$('online').textContent=s.online;$('users').innerHTML=s.users.map(u=>`<div class="item"><b>${esc(u.username)}</b> <span class="pill">${u.role}</span><div class="muted">累计 ${fmt(u.total_seconds)} · <span class="${u.last_seen&&Date.now()-u.last_seen<60000?'ok':'off'}">${u.last_seen&&Date.now()-u.last_seen<60000?'在线':'离线'}</span></div></div>`).join('');$('adminGames').innerHTML=s.games.map(g=>`<div class="item"><b>${esc(g.title)}</b><div class="muted">${esc(g.slug)} · ${g.visible?'可见':'隐藏'}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="toggleVis(${g.id},${g.visible?0:1})">${g.visible?'隐藏':'上架'}</button><button class="btn" onclick="editGame(${g.id})">编辑信息</button>${g.kind!=='proxy'?`<label class="btn">上传/更新HTML<input type="file" accept=".html,.htm,text/html" hidden onchange="uploadGame(${g.id},this.files[0])"></label><a class="btn" href="/admin/download/${g.id}" target="_blank">下载HTML</a><button class="btn danger" onclick="delGame(${g.id})">删除</button>`:''}</div></div>`).join('')}
$('createGame').onclick=async()=>{try{await api('/api/admin/game',{method:'POST',body:JSON.stringify({title:$('gTitle').value,slug:$('gSlug').value,description:$('gDesc').value,visible:$('gVisible').checked})});$('gTitle').value=$('gSlug').value=$('gDesc').value='';await refreshAdmin()}catch(e){alert(e.message)}};
async function editGame(id){const g=games.find(x=>x.id===id);if(!g)return;const title=prompt('游戏名称',g.title);if(title===null)return;const slug=prompt('Slug',g.slug);if(slug===null)return;const description=prompt('描述',g.description||'');if(description===null)return;try{await api('/api/admin/game',{method:'POST',body:JSON.stringify({id,title,slug,description,visible:!!g.visible})});await refreshAdmin()}catch(e){alert(e.message)}}
async function toggleVis(id,v){await api('/api/admin/games/'+id+'/visibility',{method:'POST',body:JSON.stringify({visible:!!v})});await refreshAdmin()}
async function uploadGame(id,file){if(!file)return;const f=new FormData();f.append('file',file);try{await api('/api/admin/games/'+id+'/upload',{method:'POST',body:f});await refreshAdmin();alert('HTML 已更新')}catch(e){alert(e.message)}}
async function delGame(id){if(!confirm('确定删除这个游戏？'))return;try{await api('/api/admin/games/'+id,{method:'DELETE'});await refreshAdmin()}catch(e){alert(e.message)}}
async function refreshAdmin(){await loadGames();await loadAdmin()}
function startHeartbeat(){clearInterval(hb);const beat=()=>{if(document.visibilityState==='visible')api('/api/heartbeat',{method:'POST',body:JSON.stringify({game_id:null})}).then(r=>{if(r.total_seconds!==undefined)$('myTime').textContent='累计 '+fmt(r.total_seconds)}).catch(()=>{})};beat();hb=setInterval(beat,30000);document.addEventListener('visibilitychange',beat)}
boot();
</script>
</body>
</html>
